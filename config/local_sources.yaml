# Local news sources.
#
# Same schema as international_sources.yaml. These sources are not part of the
# 30 international feeds; they exist so that `country_sources` can map a visitor's
# country to a predefined local publisher. The application never asks an LLM to
# choose a local source — the mapping is data, defined here.

version: 1
sources:
