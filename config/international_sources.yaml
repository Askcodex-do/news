# International news sources — exactly 30 initially.
#
# This file is the single source of truth for source configuration. Source URLs
# must never be hard-coded in application code; load them from here (or from the
# `sources` table seeded from here) at runtime.
#
# Field reference
#   id                    stable slug, used as the natural key across the system
#   name                  human-readable publisher name
#   country               ISO 3166-1 alpha-2 country of the publisher
#   type                  rss | atom | api
#   rss_url               feed URL (required for rss/atom)
#   website_url           publisher home page (required)
#   api_url               optional structured API endpoint
#   enabled               whether the ingestion worker should poll it
#   priority              0-100; higher = polled more eagerly / ranked higher
#   language              BCP-47-ish language tag of the feed
#   poll_interval_seconds how often the ingestion worker polls the feed
#   reliability_score     0-100 editorial prior; adjusted over time by source_health
#
# NOTE: reliability_score values below are reasonable editorial priors for a
# fresh deployment, not measured values. They are tuned over time in
# `source_reliability` based on observed accuracy.

version: 1
sources:
  - id: bbc-world
    name: BBC News
    country: GB
    type: rss
    rss_url: https://feeds.bbci.co.uk/news/world/rss.xml
    website_url: https://www.bbc.com/news/world
    enabled: true
    priority: 95
    language: en
    poll_interval_seconds: 180
    reliability_score: 92

