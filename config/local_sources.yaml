    name: India Today
    country: IN
    type: rss
    rss_url: https://www.indiatoday.in/rss/1206514
    website_url: https://www.indiatoday.in/
    enabled: true
    priority: 85
    language: en
    poll_interval_seconds: 240
    reliability_score: 80

