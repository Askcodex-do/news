name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # pgvector image: the schema requires the `vector` extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: news
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: news
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U news -d news"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: development
      ADMIN_API_TOKEN: ci-admin-token
      DATABASE_URL: postgresql+asyncpg://news_app:change-me@localhost:5432/news_test
      REDIS_URL: redis://localhost:6379/0
      TRUST_PROXY_HEADERS: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: pip install -e ".[dev]"

      - name: Provision the isolated test database
        # The app connects as a least-privilege role; extensions need the
        # superuser. This mirrors infrastructure/docker/postgres-init.
        env:
          PGPASSWORD: change-me
        run: |
          psql -h localhost -U news -d news -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE news_app LOGIN PASSWORD 'change-me';
          CREATE DATABASE news_test OWNER news_app;
          GRANT ALL ON DATABASE news_test TO news_app;
          SQL
          psql -h localhost -U news -d news_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          SQL

      - name: Migrate the test database
        run: alembic upgrade head

      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Test
        run: pytest

  frontend:
    name: frontend (next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Build
        run: npm run build
